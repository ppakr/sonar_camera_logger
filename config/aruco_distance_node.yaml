aruco_distance_node:
  ros__parameters:

    # ── Camera capture ────────────────────────────────────────────────────────
    camera_index: 0        # /dev/video<N> index; change if using an external webcam
    capture_fps: 30.0      # frames per second to grab from the webcam

    # ── ArUco detector ────────────────────────────────────────────────────────
    # Dictionary is fixed to DICT_4X4_50 in code (matches printed markers IDs 0–4)
    marker_size: 0.075      # physical side length of printed marker in metres
    camera_frame: camera_optical_frame

    # ── Calibration files (OpenCV FileStorage YAML format, same as lab1) ──────
    calibration_file: /home/aki/auv_ws/src/sonar_camera_logger/config/calibration_parameters.yaml
    detector_params_file: /home/aki/auv_ws/src/sonar_camera_logger/config/aruco_detector_parameters.yaml